- company:
    name: Data Reply France
    url: "https://www.reply.com/data-reply/fr"
    location: Paris, France
    logo: /images/sections/experiences/reply.png
    # Can optionally show a different logo for dark theme
    # darkLogo: /images/sections/experiences/datareply-dark.png
    # company overview
    overview: Data Reply is the Reply Group company specialized in data, AI and cloud consulting, helping enterprises design, build and operationalize data-driven and AI solutions.
  positions:
  - designation: AI Engineer
    start: September 2025
    # don't provide end date if you are currently working there. It will be replaced by "Present"
    # end: Dec 2020
    # give some points about what was your responsibilities at the company.
    responsibilities:
    - Stellantis Financial Services (Claim Handling Efficiency) - built and led to production an agentic system automating insurance claims handling (245 claims/month), based on a multi-agent architecture (Claude Sonnet 4.6, Strands Agents, AWS AgentCore) with document intelligence and automated decisioning.
    - Reached 97.3% classification accuracy, 99.4% field extraction and 96.4% check accuracy across 84 automated controls, including vision-based checks that catch tampered documents.
    - Optimized latency to ~106s/63s per claim at $0.53/claim, and added production-grade LLMOps, observability, monitoring and canary deployment.
    - Primo (AI-powered IT Support Copilot) - built a serverless Level 1 support agent (MCP server, 7+ tools, AgentCore Gateway) with multi-source RAG via Tavily, reaching 10-12s response time at $0.19/conversation, available 24/7 and multilingual.
    - Prismic (AI Content Optimization PoC) - built a 4-agent pipeline with LLM-as-judge scoring to optimize web content for SEO/GEO against brand voice, achieving +50% SEO/GEO score in under a minute.

- company:
    name: GrottiniLab
    url: "https://medinnovations.it/it/"
    location: Macerata, Italy
    logo: /images/sections/experiences/glab.jpeg
    # Can optionally show a different logo for dark theme
    # darkLogo: /images/sections/experiences/company1.jpg
    # company overview
    overview: GrottiniLab uses the latest digital computer vision technologies supported by artificial intelligence (AI), deep learning and machine learning to monitor, analyze and improve the world of Retail and Industry.
  positions:
  - designation: Machine Learning Engineer
    start: May 2023
    end: September 2025
    # give some points about what was your responsibilities at the company.
    responsibilities:
    - Designed and implemented Computer Vision solutions, creating new products or enhancing existing ones with new functionalities.
    - Improved an internal reverse image search solution for a product optimizing supermarket supply chains, adopting focal loss, a newer Transformer architecture and hyperparameter optimization, raising accuracy from 92% to 96%.
    - Trained diffusion models (LoRA, ControlNet) for personalized product generation.
    - Built an LLM-based natural-language interface to the data warehouse (text-to-SQL, RAG with router and vector DB) enabling non-technical users to query data.
    - Implemented an embedded tracking solution, proposing innovative firmware and implementing proprietary libraries, reducing costs from €500 per unit to approximately €100.
    - Ported a tracking solution from C++ to Python to improve long-term reliability and reduce technical debt, and enhanced scalability up to 100 Raspberry Pis simultaneously through automatic monitoring with AWS cloud solutions (RedShift, Lambda, AWS IoT, S3, SQS).
    - Built a 360° remote monitoring system for construction sites (Jetson Nano, ZED stereo cameras) with real-time obstacle detection.

